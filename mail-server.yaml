- name: Stalwart mail server
  hosts: stalwart-mail-server
  user: root
  become: yes
  roles:
  - role: docker
  - role: ufw
    vars:
      ufw:
        rules:
        - name: SSH from my network
          rule: allow
          from: 103.136.58.0/24
          proto: tcp
          port: 22
          state: enabled
        - name: Stalwart HTTPS-TCP
          rule: allow
          from: 0.0.0.0/0
          port: 443
          proto: tcp
          state: enabled
        - name: Stalwart HTTPS-UDP
          rule: allow
          from: 0.0.0.0/0
          port: 443
          proto: udp
          state: enabled
        - name: Stalwart SMTP
          rule: allow
          from: 0.0.0.0/0
          port: 25
          proto: tcp
          state: enabled
        - name: Stalwart IMAPS
          rule: allow
          from: 0.0.0.0/0
          port: 993
          proto: tcp
          state: enabled
        - name: Stalwart Outbound SMTP
          rule: allow
          from: 0.0.0.0/0
          port: 465
          proto: tcp
          state: enabled
        - name: Netbird wireguard
          rule: allow
          from: 0.0.0.0/0
          port: 51820
          proto: udp
          state: enabled
        - name: Test nginx TCP Load Balancer
          rule: allow
          from: 0.0.0.0/0
          port: 8888
          proto: tcp
          state: enabled
        - name: Test nginx UDP Load Balancer
          rule: allow
          from: 0.0.0.0/0
          port: 8888
          proto: udp
          state: enabled
  - role: stalwart-mail